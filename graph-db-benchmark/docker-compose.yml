version: "3.8"

services:
  arangodb:
    image: arangodb:latest
    ports:
      - "8529:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=password
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  memgraph:
    image: memgraph/memgraph:latest
    ports:
      - "7687:7687"
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
